<!-- ✅ Booking Navbar (Reverted to Previous Stable Version) -->
<div class="booking-header">

  <div class="booking-header-left">
    <div class="premium-logo">
      <span class="plane">✈</span>
      <span class="logo-text">FlySphere</span>
    </div>
    <div class="tagline">Secure Booking</div>
  </div>

  <div class="booking-steps" *ngIf="showBookingFlow">
    <div class="step"
         [class.active]="currentStep === 1"
         [class.completed]="currentStep > 1"
         (click)="navigateTo(1)">
      <span class="circle">1</span>
      <span>Booking</span>
    </div>

    <div class="step-line"></div>

    <div class="step"
         [class.active]="currentStep === 2"
         [class.completed]="currentStep > 2"
         (click)="navigateTo(2)">
      <span class="circle">2</span>
      <span>Review</span>
    </div>

    <div class="step-line"></div>

    <div class="step"
         [class.active]="currentStep === 3"
         (click)="navigateTo(3)">
      <span class="circle">3</span>
      <span>Confirmation</span>
    </div>
  </div>

  <!-- ✅ Right Section -->
  <div class="navbar-right">

    <div class="support">
      <button class="support-btn" (click)="supportOpen = !supportOpen">
        📞 CUSTOMER SERVICE ▾
      </button>

      <div class="support-dropdown" *ngIf="supportOpen">
        <div>📞 Call - +1 800 123 4567</div>
        <div>📧 Email Support</div>
        <div>💬 Live Chat</div>
      </div>
    </div>

    <div *ngIf="user" class="user-section">

      <!-- ✅ Match search page: show email inline -->
      <div class="user-email-inline">
        {{ user.email }}
      </div>

      <!-- ✅ Match search page: profile icon + dropdown -->
      <div class="profile-container">
        <button class="profile-btn" (click)="profileMenuOpen = !profileMenuOpen">
          👤
        </button>

        <div class="profile-dropdown" *ngIf="profileMenuOpen">
          <!-- Use buttons so we can call TS methods instead of routerLink -->
          <button class="dropdown-item" (click)="goToSearch()">
            Search
          </button>

          <button *ngIf="!isMyBookingsPage"
                  class="dropdown-item"
                  (click)="goToMyBookings()">
            My Bookings
          </button>

          <button class="dropdown-item logout-item" (click)="logout()">
            Logout
          </button>
        </div>
      </div>

    </div>

  </div>

</div>
